<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Wajah Modern</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* Background Ivory sesuai permintaan */
            background-color: #FFFFF0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(13, 110, 253, 0.1);
        }
        .header-blue {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 20px;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            background-color: #e9ecef;
            display: none; /* Disembunyikan sebelum kamera aktif */
        }
        #camera-feed {
            width: 100%;
            display: block;
        }
        #photo-preview {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            display: none;
            margin: 0 auto;
            border: 3px solid #0d6efd;
        }
        /* Loader untuk loading state */
        .spinner-border {
            display: none;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div id="alert-success" class="alert alert-success alert-dismissible fade show d-none text-center" role="alert">
                <strong>Berhasil!</strong> Data absensi Anda telah disimpan.
                <button type="button" class="btn-close" onclick="document.getElementById('alert-success').classList.add('d-none')"></button>
            </div>

            <div class="card card-custom bg-white">
                <div class="header-blue text-center">
                    <h3 class="mb-0 fw-bold">Absensi Kehadiran</h3>
                    <p class="mb-0 text-light">Silakan ambil foto wajah Anda</p>
                </div>
                
                <div class="card-body p-4">
                    <div class="mb-4">
                        <label for="studentName" class="form-label fw-bold text-primary">Nama Mahasiswa</label>
                        <input type="text" class="form-control form-control-lg border-primary" id="studentName" placeholder="Masukkan nama lengkap Anda">
                    </div>

                    <div class="text-center mb-4">
                        <div id="video-container" class="shadow-sm mb-3">
                            <video id="camera-feed" autoplay playsinline></video>
                        </div>
                        <img id="photo-preview" src="" alt="Hasil Foto">
                        <canvas id="canvas" class="d-none"></canvas>
                    </div>

                    <div class="d-grid gap-2">
                        <button id="btn-start-camera" class="btn btn-outline-primary btn-lg">
                            📸 Aktifkan Kamera
                        </button>
                        <button id="btn-capture" class="btn btn-primary btn-lg d-none">
                            Tahan Posisi & Ambil Foto
                        </button>
                        <button id="btn-submit" class="btn btn-success btn-lg d-none">
                            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            ✅ Absen Masuk
                        </button>
                        <button id="btn-retake" class="btn btn-secondary mt-2 d-none">
                            Ulangi Foto
                        </button>
                    </div>

                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI BAWAH INI
    const GAS_URL = "URL_APPS_SCRIPT_ANDA_DISINI";https://script.google.com/macros/s/AKfycbwIFkQdFchxeT_D8AeicojTbwZdn5nvnpwCOU-bMVqKPsXq8gh7QJQDinAo9jkkqK8g/exec 

    // Referensi Elemen DOM
    const studentName = document.getElementById('studentName');
    const videoContainer = document.getElementById('video-container');
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('canvas');
    const photoPreview = document.getElementById('photo-preview');
    
    const btnStartCamera = document.getElementById('btn-start-camera');
    const btnCapture = document.getElementById('btn-capture');
    const btnSubmit = document.getElementById('btn-submit');
    const btnRetake = document.getElementById('btn-retake');
    const alertSuccess = document.getElementById('alert-success');
    const spinner = document.querySelector('.spinner-border');

    let stream = null;
    let base64Photo = "";

    // Fungsi Aktifkan Kamera
    btnStartCamera.addEventListener('click', async () => {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            videoContainer.style.display = 'block';
            btnStartCamera.classList.add('d-none');
            btnCapture.classList.remove('d-none');
            photoPreview.style.display = 'none';
        } catch (err) {
            alert("Gagal mengakses kamera. Pastikan izin kamera diberikan.");
            console.error(err);
        }
    });

    // Fungsi Ambil Foto
    btnCapture.addEventListener('click', () => {
        // Set ukuran canvas sama dengan video
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext('2d');
        
        // Gambar frame dari video ke canvas
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Konversi ke base64 (format JPEG dengan kualitas 0.8)
        base64Photo = canvas.toDataURL('image/jpeg', 0.8);
        
        // Tampilkan preview
        photoPreview.src = base64Photo;
        photoPreview.style.display = 'block';
        videoContainer.style.display = 'none';
        
        // Atur tombol
        btnCapture.classList.add('d-none');
        btnSubmit.classList.remove('d-none');
        btnRetake.classList.remove('d-none');
    });

    // Fungsi Ulangi Foto
    btnRetake.addEventListener('click', () => {
        photoPreview.style.display = 'none';
        videoContainer.style.display = 'block';
        btnCapture.classList.remove('d-none');
        btnSubmit.classList.add('d-none');
        btnRetake.classList.add('d-none');
        base64Photo = "";
    });

    // Fungsi Absen Masuk (Kirim ke GAS)
    btnSubmit.addEventListener('click', async () => {
        const nameValue = studentName.value.trim();
        
        if (!nameValue) {
            alert("Mohon isi nama mahasiswa terlebih dahulu!");
            studentName.focus();
            return;
        }

        // Ambil waktu saat ini
        const now = new Date();
        const dateString = now.toLocaleDateString('id-ID'); // Format: DD/MM/YYYY
        const timeString = now.toLocaleTimeString('id-ID'); // Format: HH:MM:SS

        const payload = {
            name: nameValue,
            date: dateString,
            time: timeString,
            image: base64Photo
        };

        // UI Loading State
        btnSubmit.disabled = true;
        btnRetake.disabled = true;
        spinner.style.display = 'inline-block';

        try {
            // Gunakan text/plain untuk menghindari issue CORS Preflight di Google Apps Script
            const response = await fetch(GAS_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8', 
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.status === "success") {
                // Tampilkan notifikasi
                alertSuccess.classList.remove('d-none');
                
                // Reset Form
                studentName.value = "";
                btnRetake.click(); // Kembali ke mode kamera
                
                // Matikan kamera (opsional) - kita biarkan nyala untuk absen berikutnya
            } else {
                alert("Terjadi kesalahan: " + result.message);
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Gagal mengirim data. Periksa koneksi internet Anda atau URL Apps Script.");
        } finally {
            // Matikan UI Loading
            btnSubmit.disabled = false;
            btnRetake.disabled = false;
            spinner.style.display = 'none';
            window.scrollTo(0, 0); // Scroll ke atas agar notif terlihat
        }
    });
</script>
</body>
</html>
